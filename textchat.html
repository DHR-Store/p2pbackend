<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Party Chat — Test Client</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            height: 100%;
            background: #0d0e14;
            color: #eaeaea;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
        }
        body { display: flex; flex-direction: column; }

        /* ── Header ───────────────────────────────────────────── */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 14px 20px;
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            flex-shrink: 0;
        }
        .header h1 {
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header h1 svg { color: #4a9eff; }
        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 5px 12px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.65);
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #888;
            flex-shrink: 0;
        }
        .status-pill.connected .status-dot {
            background: #22c55e;
            box-shadow: 0 0 8px #22c55e;
        }
        .status-pill.connecting .status-dot {
            background: #f59e0b;
            animation: pulse 1s infinite;
        }
        .status-pill.error .status-dot { background: #ef4444; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50%      { opacity: 0.35; }
        }

        /* ── Join form ────────────────────────────────────────── */
        .join-form {
            display: flex;
            flex-direction: column;
            gap: 14px;
            padding: 28px 24px;
            max-width: 460px;
            width: 100%;
            margin: auto;
        }
        .join-form h2 {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 2px;
        }
        .join-form p {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
            line-height: 1.5;
            margin-bottom: 8px;
        }
        .field { display: flex; flex-direction: column; gap: 6px; }
        .field label {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.45);
        }
        .field input {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 8px;
            padding: 11px 13px;
            color: #fff;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .field input:focus {
            border-color: #4a9eff;
            box-shadow: 0 0 0 3px rgba(74, 158, 255, 0.15);
        }
        .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .join-btn {
            background: #4a9eff;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: filter 0.15s, transform 0.1s;
            font-family: inherit;
            margin-top: 4px;
        }
        .join-btn:hover  { filter: brightness(1.15); }
        .join-btn:active { transform: scale(0.98); }

        /* ── Chat view ────────────────────────────────────────── */
        .chat-view {
            display: none;
            flex-direction: column;
            flex: 1;
            min-height: 0;
        }
        .chat-view.active { display: flex; }
        .join-form.hidden { display: none; }

        .room-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 10px 18px;
            background: rgba(0, 0, 0, 0.2);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            flex-shrink: 0;
            font-size: 12.5px;
        }
        .room-bar .left {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .room-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 999px;
            background: rgba(74, 158, 255, 0.15);
            border: 1px solid rgba(74, 158, 255, 0.3);
            color: #4a9eff;
            font-weight: 700;
            letter-spacing: 0.04em;
            font-size: 11.5px;
            text-transform: uppercase;
        }
        .member-count {
            color: rgba(255, 255, 255, 0.55);
            font-weight: 500;
        }
        .leave-btn {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
            border-radius: 6px;
            padding: 6px 14px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
            font-family: inherit;
        }
        .leave-btn:hover { background: rgba(239, 68, 68, 0.25); }

        .messages {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 18px 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.15) transparent;
        }
        .messages::-webkit-scrollbar { width: 6px; }
        .messages::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 3px;
        }
        .empty {
            color: rgba(255, 255, 255, 0.35);
            font-size: 13px;
            text-align: center;
            padding: 40px 8px;
        }
        .msg {
            display: flex;
            flex-direction: column;
            max-width: 75%;
            gap: 3px;
            animation: fadeIn 0.2s ease;
        }
        .msg.self  { align-self: flex-end; align-items: flex-end; }
        .msg.other { align-self: flex-start; align-items: flex-start; }
        .msg.system {
            align-self: center;
            max-width: 100%;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .msg-name {
            font-size: 10.5px;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.45);
            padding: 0 10px;
        }
        .msg.self .msg-name { color: rgba(74, 158, 255, 0.85); }
        .msg-bubble {
            padding: 9px 14px;
            border-radius: 16px;
            font-size: 13.5px;
            line-height: 1.45;
            word-wrap: break-word;
            overflow-wrap: anywhere;
            white-space: pre-wrap;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #eaeaea;
        }
        .msg.self .msg-bubble {
            background: #4a9eff;
            color: #fff;
            border-color: transparent;
        }
        .msg.system .msg-bubble {
            background: rgba(245, 158, 11, 0.12);
            border: 1px solid rgba(245, 158, 11, 0.25);
            color: #fbbf24;
            font-size: 12px;
            font-style: italic;
            padding: 6px 12px;
        }
        .msg-time {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.35);
            padding: 0 10px;
            font-variant-numeric: tabular-nums;
        }

        .composer {
            display: flex;
            gap: 10px;
            padding: 14px 18px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(0, 0, 0, 0.2);
            flex-shrink: 0;
        }
        .composer input {
            flex: 1;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 11px 14px;
            color: #fff;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            min-width: 0;
        }
        .composer input:focus {
            border-color: #4a9eff;
            box-shadow: 0 0 0 3px rgba(74, 158, 255, 0.15);
        }
        .composer input:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .composer button {
            background: #4a9eff;
            color: #fff;
            border: none;
            border-radius: 10px;
            width: 46px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: filter 0.15s, transform 0.1s;
            font-family: inherit;
            flex-shrink: 0;
        }
        .composer button:hover:not(:disabled) { filter: brightness(1.15); }
        .composer button:active:not(:disabled) { transform: scale(0.95); }
        .composer button:disabled { opacity: 0.4; cursor: not-allowed; }

        /* ── Log ──────────────────────────────────────────────── */
        .log-toggle {
            position: fixed;
            bottom: 12px;
            right: 12px;
            z-index: 10;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: rgba(255, 255, 255, 0.7);
            border-radius: 999px;
            padding: 6px 14px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
        }
        .log-toggle:hover { background: rgba(255, 255, 255, 0.15); color: #fff; }
        .debug-log {
            position: fixed;
            bottom: 48px;
            right: 12px;
            width: 340px;
            max-height: 220px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            padding: 10px 12px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 11px;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.85);
            display: none;
            z-index: 9;
        }
        .debug-log.show { display: block; }
        .debug-log .line { word-break: break-all; }
        .debug-log .line.out { color: #4a9eff; }
        .debug-log .line.in  { color: #22c55e; }
        .debug-log .line.err { color: #ef4444; }
    </style>
</head>
<body>

<!-- ══ Header ══════════════════════════════════════════════ -->
<div class="header">
    <h1>
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/>
        </svg>
        Local Party — Chat Test Client
    </h1>
    <div class="status-pill" id="statusPill">
        <span class="status-dot"></span>
        <span id="statusText">Not connected</span>
    </div>
</div>

<!-- ══ Join Form ═══════════════════════════════════════════ -->
<div class="join-form" id="joinForm">
    <h2>Join a chat room</h2>
    <p>
        Connect to your local-party-api server and chat with anyone
        using the same room code. Use this to verify the server works
        before debugging the player.
    </p>

    <div class="field">
        <label>Server URL</label>
        <input id="inpServer" type="text" value="http://127.0.0.1:4000" spellcheck="false" autocomplete="off">
    </div>

    <div class="row-2">
        <div class="field">
            <label>Your Name</label>
            <input id="inpName" type="text" placeholder="e.g. Alice" autocomplete="off">
        </div>
        <div class="field">
            <label>Room Code</label>
            <input id="inpRoom" type="text" placeholder="e.g. ABC123" maxlength="8"
                   style="text-transform:uppercase;" autocomplete="off">
        </div>
    </div>

    <button class="join-btn" id="btnJoin">Connect &amp; Join Room</button>
</div>

<!-- ══ Chat View ═══════════════════════════════════════════ -->
<div class="chat-view" id="chatView">
    <div class="room-bar">
        <div class="left">
            <span class="room-badge" id="roomBadge">—</span>
            <span class="member-count" id="memberCount">0 members</span>
        </div>
        <button class="leave-btn" id="btnLeave">Leave Room</button>
    </div>

    <div class="messages" id="messages">
        <div class="empty">No messages yet. Say hi 👋</div>
    </div>

    <form class="composer" id="composer" autocomplete="off">
        <input id="inpMessage" type="text" placeholder="Type a message…"
               maxlength="500" disabled>
        <button type="submit" id="btnSend" disabled>➤</button>
    </form>
</div>

<!-- ══ Debug Log ═══════════════════════════════════════════ -->
<button class="log-toggle" id="btnLogToggle">Show Log</button>
<div class="debug-log" id="debugLog"></div>

<script>
(function () {
    'use strict';

    /* ═══════════════════════════════════════════════════════════
       DOM refs
       ═══════════════════════════════════════════════════════════ */
    const statusPill    = document.getElementById('statusPill');
    const statusText    = document.getElementById('statusText');
    const joinForm      = document.getElementById('joinForm');
    const chatView      = document.getElementById('chatView');
    const roomBadge     = document.getElementById('roomBadge');
    const memberCount   = document.getElementById('memberCount');
    const messagesEl    = document.getElementById('messages');
    const composer      = document.getElementById('composer');
    const inpMessage    = document.getElementById('inpMessage');
    const btnSend       = document.getElementById('btnSend');
    const inpServer     = document.getElementById('inpServer');
    const inpName       = document.getElementById('inpName');
    const inpRoom       = document.getElementById('inpRoom');
    const btnJoin       = document.getElementById('btnJoin');
    const btnLeave      = document.getElementById('btnLeave');
    const btnLogToggle  = document.getElementById('btnLogToggle');
    const debugLog      = document.getElementById('debugLog');

    /* ═══════════════════════════════════════════════════════════
       Debug logger
       ═══════════════════════════════════════════════════════════ */
    function log(type, msg) {
        const t = new Date().toLocaleTimeString();
        const line = document.createElement('div');
        line.className = 'line ' + type;
        line.textContent = '[' + t + '] ' + msg;
        debugLog.appendChild(line);
        debugLog.scrollTop = debugLog.scrollHeight;
        // Also log to browser console
        if (type === 'err') console.error('[Test]', msg);
        else if (type === 'in') console.log('[Test] ←', msg);
        else console.log('[Test] →', msg);
    }

    btnLogToggle.addEventListener('click', () => {
        debugLog.classList.toggle('show');
        btnLogToggle.textContent = debugLog.classList.contains('show') ? 'Hide Log' : 'Show Log';
    });

    /* ═══════════════════════════════════════════════════════════
       Status helper
       ═══════════════════════════════════════════════════════════ */
    function setStatus(state, text) {
        statusPill.className = 'status-pill ' + state;
        statusText.textContent = text;
    }

    /* ═══════════════════════════════════════════════════════════
       State
       ═══════════════════════════════════════════════════════════ */
    let socket = null;
    let currentRoom = null;
    let currentUser = null;

    /* ═══════════════════════════════════════════════════════════
       Message rendering
       ═══════════════════════════════════════════════════════════ */
    function esc(s) {
        return String(s)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    function addMessage(opts) {
        opts = opts || {};
        const { name, message, self, system } = opts;

        // Remove the "empty" placeholder on first message
        const empty = messagesEl.querySelector('.empty');
        if (empty) empty.remove();

        const row = document.createElement('div');
        const t = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        if (system) {
            row.className = 'msg system';
            row.innerHTML = '<div class="msg-bubble">' + esc(message) + '</div>';
        } else {
            row.className = 'msg ' + (self ? 'self' : 'other');
            row.innerHTML =
                '<div class="msg-name">' + esc(name || 'Anonymous') + '</div>' +
                '<div class="msg-bubble">' + esc(message) + '</div>' +
                '<div class="msg-time">' + t + '</div>';
        }

        messagesEl.appendChild(row);
        messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function clearMessages() {
        messagesEl.innerHTML = '<div class="empty">No messages yet. Say hi 👋</div>';
    }

    /* ═══════════════════════════════════════════════════════════
       Socket connection
       ═══════════════════════════════════════════════════════════ */
    function connect() {
        const serverUrl = (inpServer.value || '').trim();
        const name      = (inpName.value || '').trim() || 'Guest';
        const room      = (inpRoom.value || '').trim().toUpperCase();

        if (!serverUrl) { alert('Enter a server URL'); return; }
        if (!room)      { alert('Enter a room code'); return; }

        if (typeof io === 'undefined') {
            log('err', 'Socket.IO client not loaded (CDN blocked?)');
            setStatus('error', 'Socket.IO not loaded');
            return;
        }

        setStatus('connecting', 'Connecting to ' + serverUrl + '…');
        log('out', 'io(' + serverUrl + ')');

        try {
            socket = io(serverUrl, {
                transports: ['websocket', 'polling'],
                reconnection: true,
                reconnectionAttempts: 10,
                reconnectionDelay: 1500,
                timeout: 10000
            });
        } catch (e) {
            log('err', 'init failed: ' + e.message);
            setStatus('error', 'Init failed');
            return;
        }

        /* ── Connection lifecycle ────────────────────────────── */
        socket.on('connect', () => {
            log('in', 'connected, sid=' + socket.id);
            setStatus('connected', 'Connected');
            currentUser = name;
            currentRoom = room;

            // Announce ourselves to the room
            socket.emit('new-user-joined', {
                name: name,
                roomCode: room,
                pfp: ''
            });
            log('out', 'new-user-joined {name:' + name + ', roomCode:' + room + '}');

            // Switch UI
            joinForm.classList.add('hidden');
            chatView.classList.add('active');
            roomBadge.textContent = 'Room ' + room;
            memberCount.textContent = '1 member (you)';
            inpMessage.disabled = false;
            btnSend.disabled = false;
            inpMessage.focus();
        });

        socket.on('disconnect', (reason) => {
            log('in', 'disconnected: ' + reason);
            setStatus('error', 'Disconnected');
            inpMessage.disabled = true;
            btnSend.disabled = true;
        });

        socket.on('connect_error', (err) => {
            const msg = err && err.message ? err.message : 'unknown';
            log('err', 'connect_error: ' + msg);
            setStatus('error', 'Error: ' + msg);
        });

        /* ── Server → client events ──────────────────────────── */

        // New user joined (broadcast to others in the room)
        socket.on('user-joined', (d) => {
            log('in', 'user-joined: ' + JSON.stringify(d));
            if (!d) return;
            if (d.roomCode && currentRoom && d.roomCode !== currentRoom) return;

            if (typeof d.members === 'number') {
                memberCount.textContent = d.members + ' member' + (d.members === 1 ? '' : 's');
            }
            if (d.name) {
                addMessage({
                    system: true,
                    message: d.name + ' joined the room'
                });
            }
        });

        // Server tells us our own member count right after joining
        socket.on('updateMemberInfo', (d) => {
            log('in', 'updateMemberInfo: ' + JSON.stringify(d));
            if (!d) return;
            if (d.roomCode && currentRoom && d.roomCode !== currentRoom) return;
            if (typeof d.members === 'number') {
                memberCount.textContent = d.members + ' member' + (d.members === 1 ? '' : 's');
            }
        });

        // A user left
        socket.on('left', (d) => {
            log('in', 'left: ' + JSON.stringify(d));
            if (d && typeof d.members === 'number') {
                memberCount.textContent = Math.max(0, d.members) + ' member' +
                                          (Math.max(0, d.members) === 1 ? '' : 's');
            }
            if (d && d.name) {
                addMessage({ system: true, message: d.name + ' left the room' });
            }
        });

        // Same as "left" but from abrupt disconnects
        socket.on('leftdefault', (d) => {
            log('in', 'leftdefault: ' + JSON.stringify(d));
            if (d && typeof d.members === 'number') {
                memberCount.textContent = Math.max(0, d.members) + ' member' +
                                          (Math.max(0, d.members) === 1 ? '' : 's');
            }
            if (d && d.name) {
                addMessage({ system: true, message: d.name + ' left the room' });
            }
        });

        // ★ The important one — chat messages from other users
        socket.on('receive', (d) => {
            log('in', 'receive: ' + JSON.stringify(d));
            if (!d || typeof d.message !== 'string') return;
            addMessage({
                name: d.name || 'Anonymous',
                message: d.message,
                self: false
            });
        });

        // Catch-all for debugging: log any event we didn't explicitly handle
        socket.onAny((event, ...args) => {
            const known = ['connect', 'disconnect', 'connect_error',
                           'user-joined', 'updateMemberInfo', 'left',
                           'leftdefault', 'receive'];
            if (!known.includes(event)) {
                log('in', '[unhandled event] ' + event + ': ' + JSON.stringify(args));
            }
        });
    }

    /* ═══════════════════════════════════════════════════════════
       Send a message
       ═══════════════════════════════════════════════════════════ */
    function sendMessage(text) {
        text = (text || '').trim();
        if (!text) return;

        if (!socket || !socket.connected) {
            log('err', 'Cannot send: socket not connected');
            addMessage({ system: true, message: 'Not connected — cannot send.' });
            return;
        }

        // Server broadcasts to OTHERS only → echo locally
        socket.emit('send', text);
        log('out', 'send: ' + text);

        addMessage({
            name: currentUser,
            message: text,
            self: true
        });
    }

    /* ═══════════════════════════════════════════════════════════
       UI Event Listeners
       ═══════════════════════════════════════════════════════════ */
    btnJoin.addEventListener('click', (e) => {
        e.preventDefault();
        connect();
    });

    // Submit on Enter in any of the join inputs
    [inpServer, inpName, inpRoom].forEach(el => {
        el.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') { e.preventDefault(); connect(); }
        });
    });

    composer.addEventListener('submit', (e) => {
        e.preventDefault();
        const text = inpMessage.value;
        inpMessage.value = '';
        sendMessage(text);
        inpMessage.focus();
    });

    btnLeave.addEventListener('click', () => {
        if (socket) {
            if (currentUser) {
                try { socket.emit('disconnectUser', currentUser); } catch (_) {}
            }
            try { socket.disconnect(); } catch (_) {}
            socket = null;
        }

        // Reset UI
        currentRoom = null;
        currentUser = null;
        chatView.classList.remove('active');
        joinForm.classList.remove('hidden');
        clearMessages();
        setStatus('', 'Not connected');
        inpMessage.disabled = true;
        btnSend.disabled = true;
        inpMessage.value = '';
        log('out', 'left room');
    });

    /* ═══════════════════════════════════════════════════════════
       Pre-fill from URL params (?server=&room=&user=)
       Useful to launch the test with pre-filled values
       ═══════════════════════════════════════════════════════════ */
    const params = new URLSearchParams(location.search);
    if (params.get('server')) inpServer.value = params.get('server');
    if (params.get('room'))   inpRoom.value   = params.get('room').toUpperCase();
    if (params.get('user'))   inpName.value   = params.get('user');

    // Auto-join if all three params are present
    if (params.get('server') && params.get('room') && params.get('user')) {
        setTimeout(connect, 200);
    }

    console.log('[ChatTest] Ready. Fill the form or use ?server=...&room=...&user=...');
})();
</script>
</body>
</html>
